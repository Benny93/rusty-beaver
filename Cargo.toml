[package]
name = "rusty-beaver"
version = "0.1.0"
edition = "2024"
description = "A DBeaver-style database tool built with GPUI, drivable by AI agents over MCP"
license = "MIT"

[dependencies]
lsp-types = { version = "0.97", features = ["proposed"] }
anyhow = "1"
gpui-kit = { version = "=0.6.6", features = ["tree-sitter-sql"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
xcap = "0.9"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
rustls-native-certs = "0.8"
mysql = { version = "28", default-features = false, features = ["default-rust", "rustls-tls-ring"] }
# Passwords in the OS keychain (macOS Keychain, Windows Credential Manager, Linux Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Vault over HTTPS, trusting the OS certificate store (internal CAs).
ureq = { version = "3", features = ["platform-verifier", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSImage", "NSWindow"] }
objc2-foundation = { version = "0.2", features = ["NSData", "NSThread", "NSArray", "NSEnumerator"] }

[build-dependencies]
embed-resource = "3.0"

# Keep target/ small: line numbers in backtraces, but no full debug info (the bulk of
# target/ with gpui). Set debug = true locally when stepping through code in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# Cross builds to Windows from Linux/macOS (`make windows-docker`): gpui precompiles its
# DirectX shaders only on a Windows host; with debug assertions it compiles them at runtime.
[profile.release-cross]
inherits = "release"
debug-assertions = true

# Installers (.dmg, NSIS .exe, .deb, .AppImage): `cargo packager --release`, run by
# .github/workflows/release.yml for every v* tag (`make release`).
[package.metadata.packager]
product-name = "Rusty Beaver"
identifier = "io.github.benny93.rustybeaver"
category = "DeveloperTool"
before-packaging-command = "cargo build --release --locked"
out-dir = "target/dist"
icons = ["assets/rusty-beaver.icns", "assets/rusty-beaver.ico", "assets/icon.png"]
